# railway.toml
# Configuration file for deploying a Django + Pipenv app using Python 3.8 on Railway

[build]
# Install Python 3.8 using a Heroku-style runtime declaration
builder = "paketobuildpacks/builder:base"
buildCommand = """
# Force Python 3.8 environment
echo 'python-3.8.18' > .python-version

# Install Pipenv if not present
pip install --upgrade pip && pip install pipenv

# Install project dependencies via Pipenv
pipenv install --deploy --ignore-pipfile
"""

[start]
# Run migrations, then start the Django server on Railway's assigned port
startCommand = """
pipenv run python manage.py migrate && \
pipenv run python manage.py runserver 0.0.0.0:$PORT
"""

[env]
# Environment variables for Django
DJANGO_SECRET_KEY = "@dm1#zy&nq5_2g9y8e4!687sj+$*v&7-)4#=36w!q4lm4td0e@"
DEBUG = "False"
ALLOWED_HOSTS = "*"
PYTHON_VERSION = "3.8"
