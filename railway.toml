# railway.toml
# Configuration for deploying a Django + Pipenv app using Python 3.8 on Railway

[build]
# Build command: create Python 3.8 version file and install dependencies
buildCommand = """
echo 'python-3.8.18' > runtime.txt
pip install --upgrade pip && pip install pipenv
pipenv install --deploy --ignore-pipfile
"""

[start]
# Start command: run migrations and start Django
startCommand = """
pipenv run python manage.py migrate && \
pipenv run python manage.py runserver 0.0.0.0:$PORT
"""

[env]
DJANGO_SECRET_KEY = "@dm1#zy&nq5_2g9y8e4!687sj+$*v&7-)4#=36w!q4lm4td0e@"
DEBUG = "False"
ALLOWED_HOSTS = "*"
PYTHON_VERSION = "3.8"
